<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f5f4f0">
  <title>Wispr Growth OS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1a1a'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='Figtree,Helvetica,Arial,sans-serif' font-weight='700' font-size='18' fill='%23fcfcfb'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Figtree:wght@400;500;600;700&family=Google+Sans+Code:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Doto:wght@500;800&family=Spline+Sans+Mono:wght@400;500;700&family=VT323&display=swap">
  <link rel="stylesheet" href="/wispr-kit/wispr.css">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/growthos.css">
  <style>
    /* Wispr Growth OS in its own tab: the app fills the page. The desktop icon on sameep.ai opens this;
       the lock-screen login (same origin) carries over, and the @wispr.ai code is the real gate. */
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--lumen); }
    .pv, .pv .desk, .pv .desk__area { position: fixed; inset: 0; }
    /* the cover: wisprflow.ai's marketing mode (lumen page, bordered nav box, eyebrow → serif H1 with an italic line) */
    .pv__lock { position: fixed; inset: 0; z-index: 30; overflow-y: auto; padding: 0 16px 48px; }
    .pv__lock .w-nav { margin: 16px auto 0; }
    .pv__card { width: min(560px, 100%); margin: 0 auto; padding: 72px 0 0; }
    .pv__card .w-hero { padding: 0; }
    .pv__card h1 i { font-style: italic; display: block; }
    .pv__card a { color: var(--fathom); }
    .pv__team { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 8px 0 0; }
    .pv__team button { min-height: 44px; border: 2px solid transparent; border-radius: .5rem; background: var(--lumen-dark); color: var(--vast-950); font: 600 14px var(--w-sans); cursor: pointer; transition: transform .2s, background-color .2s, border-color .2s; }
    .pv__team button:hover { background: var(--dawn); border-color: var(--vast-950); transform: translateY(-2px); }
    .pv__team .pv__else { background: transparent; border-color: var(--lumen-dark); }
    @media (max-width: 600px) { .pv__card { padding-top: 40px; } }
  </style>
</head>
<body>
  <div class="pv"><div class="desk"><div class="desk__area"></div></div></div>
  <script type="module">
    import { createWM } from '../js/app/wm.js';
    import { openGrowthOS, canSeeGrowthOS } from '../js/app/growthos.js';
    import { isWispr } from '../js/version.js';
    const area = document.querySelector('.desk__area');
    const wm = createWM(area);
    const params = new URLSearchParams(location.search);
    // ?as=w-nimisha logs in as that teammate (for reviewing a module directly)
    const as = params.get('as');
    if (as && as.startsWith('w-')) localStorage.setItem('offthecv.visitor', JSON.stringify({ name: as.slice(2)[0].toUpperCase() + as.slice(3), character: as }));
    const visitor = () => { try { return JSON.parse(localStorage.getItem('offthecv.visitor') || 'null'); } catch { return null; } };
    // closing the app's window closes the tab when the site opened it, else goes back to the site
    // "Someone else" passes a nameless teammate for this visit only (nothing stored); the @wispr.ai code is the gate
    const open = (who = visitor()) => {
      const w = openGrowthOS(wm, { visitor: who, start: params.get('m') || undefined });
      const x = w?.el?.querySelector('.win__close');
      x?.addEventListener('click', () => { if (window.opener) window.close(); else location.href = '../?skip&version=wispr'; }, { once: true });
    };
    if (canSeeGrowthOS()) open();
    else {
      // opened directly (not from the desktop): say who you are first; the @wispr.ai code is still required after this
      const team = (await (await fetch('../persona.json')).json()).wisprTeam || [];
      const lock = document.createElement('div');
      lock.className = 'pv__lock w-site';
      lock.innerHTML = isWispr
        ? `<nav class="w-nav" aria-label="Wispr Growth OS"><span class="w-lockup"><span class="w-lockup__name">Wispr Growth OS</span></span></nav><div class="pv__card"><div class="w-hero"><p class="w-eyebrow">For the Wispr team</p><h1>Who’s <i>this?</i></h1><p>Pick your name. Next, you’ll get a code at your @wispr.ai email.</p></div><div class="pv__team"></div></div>`
        : `<nav class="w-nav" aria-label="Wispr Growth OS"><span class="w-lockup"><span class="w-lockup__name">Wispr Growth OS</span></span></nav><div class="pv__card"><div class="w-hero"><p class="w-eyebrow">Sign in</p><h1>For the Wispr team, <i>only.</i></h1><p>Open it from <a href="../?version=wispr">the Wispr version of sameep.ai</a>.</p></div></div>`;
      if (isWispr) lock.querySelector('.pv__team').append(...team.map((t) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t.label; b.onclick = () => { localStorage.setItem('offthecv.visitor', JSON.stringify({ name: t.label, character: t.id })); lock.remove(); open(); }; return b; }));
      if (isWispr) { const b = document.createElement('button'); b.type = 'button'; b.className = 'pv__else'; b.textContent = 'Someone else'; b.onclick = () => { lock.remove(); open({ name: '', character: 'w-other' }); }; lock.querySelector('.pv__team').append(b); }
      document.body.append(lock);
    }
  </script>
<script type="module" src="../js/analytics.js"></script>
<script type="module" src="../js/guide/page.js" data-guide="growthos"></script>
</body>
</html>
