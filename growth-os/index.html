<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Wispr Growth OS (preview)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Doto:wght@500;800&family=Spline+Sans+Mono:wght@400;500;700&family=VT323&display=swap">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/growthos.css">
  <style>
    /* preview only: a bare desktop, so the app can be reviewed before the hook goes in */
    html, body { height: 100%; overflow: hidden; }
    .pv { position: fixed; inset: 0; background: #000; }
    .pv .desk__fallback { background: linear-gradient(160deg, #3aa6b9, #0a6f84 60%, #064a59); }
    .pv__bar { position: absolute; top: 0; left: 0; right: 0; height: 28px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: linear-gradient(#fafafa, #dadada); border-bottom: 1px solid #111; font: 600 12px var(--f-ui); color: #111; z-index: 20; }
    .pv__bar span:last-child { margin-left: auto; font-weight: 500; color: #555; }
    .pv__lock { position: absolute; inset: 28px 0 0; z-index: 30; display: grid; place-items: center; background: rgba(4,35,43,.72); }
    .pv__card { width: min(420px, calc(100% - 32px)); padding: 18px; background: var(--plat-2); border: 1px solid #111; box-shadow: inset 1px 1px 0 #fff, 6px 6px 0 rgba(0,0,0,.5); color: #111; font: 400 13px/1.5 var(--f-ui); }
    .pv__card h1 { margin: 0 0 6px; font: 400 30px/1 var(--f-head); }
    .pv__team { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; margin: 12px 0; }
    .pv__team button { min-height: 40px; }
    @media (max-width: 500px) { .pv__bar span:last-child { display: none; } }
  </style>
</head>
<body>
  <div class="pv">
    <div class="desk">
      <div class="desk__fallback"></div>
      <div class="pv__bar"><span>Wispr Growth OS</span><span>Preview · not linked from the site</span></div>
      <div class="desk__area"><div class="desk__home"><ul class="icons" aria-label="Desktop"><li></li><li></li></ul></div></div>
    </div>
  </div>
  <script type="module">
    import { createWM } from '../js/app/wm.js';
    import { install, openGrowthOS, canSeeGrowthOS } from '../js/app/growthos.js';
    import { isWispr } from '../js/version.js';
    const area = document.querySelector('.desk__area');
    const wm = createWM(area);
    // ?as=w-nimisha logs in as that teammate (for reviewing a module directly)
    const as = new URLSearchParams(location.search).get('as');
    if (as && as.startsWith('w-')) localStorage.setItem('offthecv.visitor', JSON.stringify({ name: as.slice(2)[0].toUpperCase() + as.slice(3), character: as }));
    const visitor = () => { try { return JSON.parse(localStorage.getItem('offthecv.visitor') || 'null'); } catch { return null; } };
    const go = () => { install({ wm, area, visitor: visitor() }); openGrowthOS(wm, { visitor: visitor(), start: new URLSearchParams(location.search).get('m') || undefined }); };
    if (canSeeGrowthOS()) go();
    else {
      // stand-in for the lock screen: pick a teammate (same storage the real login writes)
      const team = (await (await fetch('../persona.json')).json()).wisprTeam || [];
      const lock = document.createElement('div');
      lock.className = 'pv__lock';
      lock.innerHTML = `<div class="pv__card"><h1>Log in</h1><p>${isWispr ? 'Pick a Wispr teammate. On the real site this is the lock screen.' : 'This preview needs <a href="?version=wispr">?version=wispr</a>, like the real Wispr link.'}</p><div class="pv__team"></div><button class="btn" type="button" data-guest>Guest (shows the locked folder)</button></div>`;
      if (isWispr) lock.querySelector('.pv__team').append(...team.map((t) => { const b = document.createElement('button'); b.className = 'btn'; b.type = 'button'; b.textContent = t.label; b.onclick = () => { localStorage.setItem('offthecv.visitor', JSON.stringify({ name: t.label, character: t.id })); lock.remove(); go(); }; return b; }));
      lock.querySelector('[data-guest]').onclick = () => { lock.remove(); openGrowthOS(wm, { visitor: { name: 'Guest' } }); };
      document.querySelector('.desk').append(lock);
    }
  </script>
</body>
</html>
