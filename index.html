      <h1>Sameep Rehlan · Off the CV</h1>
      <p>Growth, games and a lot of things built by voice. No point in a CV, they’re all the same, so I burned mine into a CD. Put it in a late-90s iMac and it plays “Off the CV”, a choose-your-own-adventure pixel-art podcast about my work, in my cloned voice. You steer it by clicking a thread or saying it out loud. It needs JavaScript; here is the short version.</p>
      <h2>Work</h2>
      <ul>
        <li><a href="https://sameep.ai/recording/">My application for Wispr Flow’s growth team</a>: a 3-minute video and the links.</li>
        <li><a href="https://thelastprompt.ai/switchboard">Switchboard</a>: a Mac app and browser bridge that lets any app run on your own Claude Code or Codex. No new account, no API key.</li>
        <li><a href="https://sameep.ai/khushi-launch/">Nailinit × Khushi Kapoor</a>: Nailinit’s launch campaign with the actor Khushi Kapoor.</li>
        <li><a href="https://sameep.ai/secretslumberparty/">The Secret Slumber Party</a>: a sleepover with Khushi Kapoor for Nailinit that you applied to by chatting with her.</li>
        <li><a href="https://sameep.ai/pinkbox/">Nykaa Pink Box</a>: a wishlist that turned into your cart the moment a Nykaa sale went live.</li>
        <li><a href="https://sameep.ai/often/">Often and Trippy</a>: a travel startup I co-founded, and its AI for travel hacking.</li>
        <li><a href="https://sameep.ai/nia/">Nia</a>: an internal company OS that runs a D2C brand from one dashboard.</li>
        <li><a href="https://sameep.ai/brewbot/">Brew-bot</a>: a pour-over machine you run by voice.</li>
        <li><a href="https://www.ppt.live">ppt.live</a>: turn any talk into a live show the room plays on their phones.</li>
        <li>Small tools: <a href="https://sameep.ai/copyflow/">Copyflow</a>, <a href="https://sameep.ai/repurpose/">Repurpose</a>, <a href="https://sameep.ai/reachout/">Reachout</a>, <a href="https://sameep.ai/cut/">Cut</a>, <a href="https://sameep.ai/annotate/">Annotate</a>, <a href="https://sameep.ai/pastedeck/">PasteDeck</a>.</li>
      </ul>
