<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COS · Company OS for consumer brands</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
<meta name="description" content="COS, a company OS for consumer brands: products and modules, tasks across modules, chat, canvas and a dashboard, with a Chief of Staff agent running the room.">
<meta property="og:title" content="COS · Company OS for consumer brands">
<meta property="og:description" content="Products and modules, tasks across modules, chat, canvas and a dashboard, with a Chief of Staff agent running the room.">
<meta property="og:site_name" content="COS by sameep.ai">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4f3ef">
<script>/* theme before first paint: light, unless the person picked dark (js/theme.js keeps the same rule) */
(function () { var t = null; try { t = localStorage.getItem('bc-theme'); } catch (e) {}
  if (t !== 'dark') t = 'light';
  document.documentElement.setAttribute('data-theme', t); })();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Spline+Sans+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./app.css">
<!-- one stylesheet per page module; each module owns only its own file -->
<link rel="stylesheet" href="./pages/signin.css">
<link rel="stylesheet" href="./pages/team.css">
<link rel="stylesheet" href="./pages/today.css">
<link rel="stylesheet" href="./pages/chats.css">
<link rel="stylesheet" href="./pages/hub.css">
<link rel="stylesheet" href="./pages/os.css">
<link rel="stylesheet" href="./pages/billing.css">
<link rel="stylesheet" href="./pages/inbox.css">
<link rel="stylesheet" href="./pages/hiring.css">
<link rel="stylesheet" href="./pages/company.css">
<link rel="stylesheet" href="./js/steps.css">
<link rel="stylesheet" href="./pages/cos.css">
<link rel="stylesheet" href="./pages/dash.css">
<link rel="stylesheet" href="./pages/work.css">
<link rel="stylesheet" href="./pages/products.css">
<link rel="stylesheet" href="./pages/home.css">
<link rel="stylesheet" href="./mobile.css"><!-- the phone shell (js/mobile.js); loads last so it wins at 760 px and below -->
</head>
<body>
<div id="signin" class="signin-wrap" hidden></div>

<div id="shell" class="shell" hidden>
  <nav class="rail" aria-label="Sections">
    <a class="rail-brand" href="#" id="brand-home"><b>COS</b><span>Company OS for consumer brands</span></a>
    <div id="nav" class="rail-nav"></div>
    <div class="rail-foot">
      <button id="me-btn" class="avatar" type="button" aria-expanded="false" aria-controls="me-menu"><span class="sr">Your account</span><span id="me-init" aria-hidden="true"></span></button>
      <a class="rail-maker" href="https://sameep.ai" rel="noopener">sameep.ai</a>
    </div>
  </nav>
  <div id="me-menu" class="me-menu" hidden>
    <div><p id="me-name" class="me-name"></p><p id="me-mail" class="me-mail"></p></div>
    <p class="me-role">Role here: <span id="role"></span></p>
    <nav id="me-more" class="me-more" aria-label="More"></nav>
    <label id="ws-pick"><span class="sr">Workspace</span><select id="ws"></select></label>
    <hr>
    <button id="signout" class="linkish" type="button">Sign out</button>
  </div>

  <div class="col">
    <header class="top">
      <p class="crumbs"><span id="crumb-ws" class="c-ws"></span><span class="c-sep" aria-hidden="true">/</span><span id="crumb-sec" class="c-sec"></span></p>
      <div class="top-r">
        <span id="sample-pill" class="pill-top is-quiet" hidden>Sample data</span>
        <button id="theme-btn" class="theme-btn" type="button" aria-label="Switch theme"></button>
        <a id="agents-pill" class="pill-top" href="#"><span class="dot" aria-hidden="true"></span><span id="agents-n"></span></a>
      </div>
    </header>
    <main class="main">
      <div id="banner"></div>
      <div id="page"></div>
    </main>
    <form id="ask" class="ask" autocomplete="off">
      <div class="ask-in">
        <div id="ask-ans" class="ask-ans" aria-live="polite" hidden></div>
        <div id="ask-chips" class="ask-chips"></div>
        <div class="ask-row">
          <span class="ask-mark" aria-hidden="true">C</span>
          <label class="sr" for="ask-q">Ask the chief of staff</label>
          <input id="ask-q" name="q" maxlength="2000" enterkeyhint="send">
          <button id="ask-send" class="ask-send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p class="si-note">This workspace needs JavaScript.</p></noscript>
<script type="module" src="./js/theme.js"></script>
<script type="module" src="./js/app.js"></script>
<script type="module" src="./js/mobile.js"></script>
</body>
</html>
