<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Hero (dev)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Doto:wght@500;800&family=Patrick+Hand&family=Spline+Sans+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hero.css">
  <style>
    html, body { margin: 0; background: #0f0d0b; }
    .after { min-height: 60vh; display: grid; place-items: center; color: #f3eee2; font: 500 12px/1 "Spline Sans Mono", monospace; letter-spacing: .2em; text-transform: uppercase; }
  </style>
</head>
<body>
  <section id="hero"></section>
  <div class="after" id="after">[ app mounts here ]</div>
  <script type="module">
    import { mountHero } from './js/hero/main.js';
    const el = document.getElementById('hero');
    const t0 = performance.now();
    window.__done = null;
    // dev: capture canvas frames at progress values (needs the local dev server's /__shot endpoint)
    window.__shoot = async (list, frames = 30) => {
      for (const [name, p] of list) {
        const d = await window.__hero.shot(p, { frames });
        await fetch('/__shot/' + name + '.jpg', { method: 'POST', body: d }).catch(() => {});
      }
      return list.length;
    };
    mountHero(el, {
      onDone: (info) => { window.__done = info; document.getElementById('after').textContent = '[ onDone fired ]'; console.log('[hero] onDone', info); },
      onProgress: (p) => { window.__p = p; },
    }).then(() => console.log('[hero] mounted in', Math.round(performance.now() - t0), 'ms'))
      .catch((e) => console.error('[hero] mount failed', e));
  </script>
</body>
</html>
