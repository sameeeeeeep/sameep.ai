<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f0">
  <meta name="color-scheme" content="light">
  <title>Try Pack 1 · Wispr for Builders</title>
  <meta name="description" content="Try Wispr File, Wish, Review and PM in your browser. Hold Flow and say it: find a file, convert an image, review this page, or run a task board.">
  <meta property="og:title" content="Try Pack 1 · Wispr for Builders">
  <meta property="og:description" content="Hold Flow and say it. Four Pack 1 mods you can try in the browser, no install.">
  <link rel="canonical" href="https://sameep.ai/wispr-builders/try/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1a1a'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='Figtree,Helvetica,Arial,sans-serif' font-weight='700' font-size='18' fill='%23fcfcfb'%3EB%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Figtree:wght@400;500;600;700&family=Google+Sans+Code:wght@400;500&display=swap">
  <link rel="stylesheet" href="/wispr-kit/wispr.css">
  <link rel="stylesheet" href="try.css">
</head>
<body class="try">
  <header class="t-top">
    <a class="w-lockup t-lock" href="/wispr-builders/" data-home><span class="w-lockup__name">Wispr for Builders</span><span class="w-badge w-badge--quiet">Try Pack 1</span></a>
    <nav class="t-tabs" id="tabs" aria-label="Pick a mod"></nav>
    <button class="w-btn w-btn--ghost t-close" type="button" id="close" hidden aria-label="Close the demo">Close</button>
  </header>

  <main class="t-main">
    <section class="t-intro" aria-live="polite">
      <h1 class="t-h" id="h"></h1>
      <p class="t-sub" id="sub"></p>
    </section>

    <section class="t-ask" id="ask" aria-label="Wispr Bridge ask field">
      <div class="t-ask__head">
        <span class="t-ask__lock">Wispr Bridge</span>
        <span class="wb-hold">Hold <kbd class="w-kbd">fn</kbd> and speak</span>
        <span class="t-ask__or">or type</span>
        <button class="w-btn w-btn--outline t-mic" type="button" id="mic" hidden aria-pressed="false" title="Uses your browser’s speech recognition. With Wispr Flow you don’t need this.">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Use the mic</span>
        </button>
      </div>
      <div class="t-ask__row">
        <input class="t-ask__in" id="q" type="text" autocomplete="off" spellcheck="false" enterkeyhint="send" aria-label="Say what you want">
        <button class="w-btn w-btn--primary t-go" type="button" id="go">Send</button>
      </div>
      <div class="t-ask__foot"><span class="wb-hint"><kbd class="w-kbd">return</kbd> to send</span><span class="t-try">Try:</span><div class="t-chips" id="chips"></div></div>
      <div class="t-route" id="route" hidden></div>
    </section>

    <section class="t-real" aria-label="About this demo">
      <p><span id="status" data-wstatus="file" data-wstatus-class="t-status" hidden></span> <span id="realtxt"><b>This is a browser demo.</b> The real mod does this on your Mac.</span></p>
      <div class="t-cmd"><code id="cmd"></code><button class="w-btn w-btn--secondary" type="button" id="copycmd">Copy</button></div>
    </section>

    <section class="t-screen" id="screen" aria-label="Demo screen">
      <div class="t-layer" id="layer"></div>
      <div class="t-stage" id="stage"></div>
    </section>
  </main>

  <div class="t-dialog" id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <div class="w-dialog t-dialog__box">
      <div class="t-dialog__head"><b id="dlg-t"></b><button class="w-btn w-btn--ghost" type="button" data-x aria-label="Close">×</button></div>
      <div class="t-dialog__body" id="dlg-b"></div>
    </div>
  </div>

  <noscript><p class="t-nos">This demo needs JavaScript. <a href="/wispr-builders/">Back to Pack 1</a>.</p></noscript>
  <script src="/wispr-kit/status.js" defer></script>
  <script src="vendor/untrusted.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
